apiVersion: apps/v1
kind: Deployment
metadata:
  name: careertrack-backend
  namespace: careertrack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: careertrack-backend
  template:
    metadata:
      labels:
        app: careertrack-backend
    spec:
      containers:
        - name: backend
          image: sachinrh18/careertrack-backend:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:mysql://mysql:3306/careertrack"
            - name: SPRING_DATASOURCE_USERNAME
              value: "root"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-credentials
                  key: MYSQL_ROOT_PASSWORD
